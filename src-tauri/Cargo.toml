[package]
name = "messy"
version = "0.0.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
# Wysyłanie plików ponad limit Messengera do Gofile (src/upload.rs). TLS i reszta jak w tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["multipart", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tokio = { version = "1", features = ["time"] }
url = "2"
webview2-com = "0.39"
# DwmFlush: animacja okna w trybie krawędzi zsynchronizowana z odświeżaniem monitora. Wersja ta sama co w wry.
windows = { version = "0.62", features = ["Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
